<script>
const collage = document.querySelector('.collage');
const lightbox = document.querySelector('.lightbox');
const lightboxImg = lightbox.querySelector('img');

function resizeMasonry(){
  if (!collage) return;

  const rowHeight = parseInt(getComputedStyle(collage).gridAutoRows);
  const rowGap = parseInt(getComputedStyle(collage).gap);

  collage.querySelectorAll('img').forEach(img => {
    const apply = () => {
      const h = img.getBoundingClientRect().height;
      const span = Math.ceil((h + rowGap) / (rowHeight + rowGap));
      img.style.gridRowEnd = `span ${span}`;
    };

    if (img.complete) apply();
    else img.addEventListener('load', apply, { once: true });

    // Lightbox click
    img.style.cursor = 'zoom-in';
    img.addEventListener('click', () => {
      lightboxImg.src = img.src;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
  });
}

// Close lightbox
lightbox.addEventListener('click', () => {
  lightbox.classList.remove('open');
  lightboxImg.src = '';
  document.body.style.overflow = '';
});

// ESC key closes
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && lightbox.classList.contains('open')) {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
    document.body.style.overflow = '';
  }
});

window.addEventListener('load', resizeMasonry);
window.addEventListener('resize', resizeMasonry);
</script>
