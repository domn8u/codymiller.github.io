<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cody Miller — Resume</title>
  <meta name="description" content="Resume of Cody Miller, digital marketing and communications professional in Washington, D.C.">
  <link rel="icon" href="Resources/me_logo_round.png">

  <!-- Fonts (same as site) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Global site styles -->
  <link rel="stylesheet" href="Resources/ePortfolio.css">

  <!-- PAGE-ONLY STYLES (Resume) -->
  <style>
    /* Title band */
    .resume-title-band{
      background: var(--black);
      padding: 44px 0 36px;
      text-align: center;
      border-bottom: 6px solid #222;
    }
    .resume-title-band h1{
      font-family: "Bebas Neue", sans-serif;
      font-size: 72px;
      letter-spacing: 2px;
      color: var(--yellow);
      margin: 0;
    }

    /* PDF viewer area */
    .resume-wrap{
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 18px 70px;
      text-align: center;
    }

    .pdf-frame{
      width: 100%;
      height: 80vh;              /* big viewer like a page */
      border: 6px solid var(--borderYellow);
      background: #fff;
      overflow: hidden;
    }

    /* Fallback link */
    .resume-link{
      margin-top: 14px;
      font-family: Montserrat, sans-serif;
      font-size: 16px;
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 5px;
      text-decoration-thickness: 2px;
      display: inline-block;
    }

    @media (max-width: 520px){
      .resume-title-band h1{ font-size: 56px; }
      .pdf-frame{ height: 70vh; }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
<header>
  <div class="nav">
    <div class="nav-left">
      <div class="avatar">
        <img src="Resources/me_logo_round.png" alt="Cody Headshot Logo">
      </div>
      <div class="name">Cody Miller</div>
    </div>

    <input type="checkbox" id="nav-toggle" class="nav-toggle">

    <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <nav class="nav-right">
      <a href="index.html">Home</a>
      <a href="web-ux.html">Web &amp; UX</a>
      <a href="media-features.html">Media Features</a>
      <a href="resume.html" class="active">Resume</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="contact.html" class="contact-btn">Contact</a>
    </nav>
  </div>
</header>

  <!-- RESUME MAIN -->
  <main>
    <div class="resume-title-band">
      <h1>Resume</h1>
    </div>

    <section class="resume-wrap">
      <!-- Embedded PDF viewer -->
	<iframe
	  class="pdf-frame" src="Resources/MILLER_CODY_RESUME.pdf"
	  title="Resume PDF">
	</iframe>


      <!-- Always-available link -->
      <a class="resume-link" href="Resources/MILLER_CODY_RESUME.pdf" target="_blank" rel="noopener">
        Download Resume (PDF)
      </a>
    </section>
  </main>

  <!-- FOOTER -->
  <div class="footer-strip">
    <div class="footer-wrap">
      <div class="footer-left">
        <div class="footer-avatar">
          <img src="Resources/me_logo_round.png" alt="Cody Miller logo">
        </div>
      </div>

      <div class="footer-center">
        <a href="contact.html" class="yellow">Contact Me</a>
        <a href="web-ux.html" class="yellow">Web &amp; UX</a>
        <a href="portfolio.html" class="yellow">Portfolio</a>
        <a href="resume.html" class="active">Resume</a>
        <a href="index.html" class="yellow">Home</a>
        <a href="media-features.html" class="yellow">Media</a>
      </div>

      <div class="footer-right">Cody Miller</div>
    </div>
  </div>

</body>
</html>
