<head>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="Resources/ePortfolio.css">

  <style>
    .contact-title-band{
      background: var(--black);
      padding: 44px 0 36px;
      text-align: center;
      border-bottom: 6px solid #222;
    }
    .contact-title-band h1{
      font-family: "Bebas Neue", sans-serif;
      font-size: 72px;
      letter-spacing: 2px;
      color: var(--yellow);
      margin: 0;
    }

    .contact-wrap{
    max-width: 900px;
    margin: 0 auto;
    padding-top: 0px;
    padding-right: 18px;
    padding-left: 18px;
    text-align: center;
    }

    .contact-line{
      font-family: "Bebas Neue", sans-serif;
      font-size: 36px;
      letter-spacing: 1px;
      color: #fff;
      margin: 16px 0;
      text-transform: uppercase;
    }

    .contact-line a{
      color: #fff;
      text-decoration: underline;
      text-decoration-thickness: 3px;
      text-underline-offset: 6px;
    }

    @media (max-width: 520px){
      .contact-title-band h1{ font-size: 56px; }
      .contact-line{ font-size: 28px; }
    }

  .contact-form-wrap{
    max-width: 800px;
    margin: 0 auto;
    padding: 30px 18px 70px;
    text-align: left;
  }

  .contact-form{
    margin-top: 30px;
    display: grid;
    gap: 18px;
  }

  .contact-form label{
    font-family: "Bebas Neue", sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #fff;
    display: block;
    margin-bottom: 6px;
  }

  .contact-form input[type="text"],
  .contact-form input[type="email"],
  .contact-form textarea{
    width: 100%;
    font-family: Montserrat, sans-serif;
    font-size: 16px;
    padding: 12px 12px;
    border-radius: 8px;
    border: 3px solid var(--borderYellow);
    background: #fff;
    color: #111;
    outline: none;
  }

  .contact-form textarea{
    min-height: 160px;
    resize: vertical;
  }

  .contact-form input:focus,
  .contact-form textarea:focus{
    border-color: #fff;
    box-shadow: 0 0 0 3px rgba(255,204,0,0.35);
  }

  /* Radio group styling */
  .radio-group{
    border: 3px solid var(--borderYellow);
    border-radius: 8px;
    padding: 12px;
    background: #1a1a1a;
  }

  .radio-options{
    display: grid;
    gap: 10px;
    margin-top: 6px;
  }

  .radio-option{
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: Montserrat, sans-serif;
    font-size: 16px;
    color: #fff;
  }

  .radio-option input{
    transform: scale(1.2);
    accent-color: var(--yellow);
    cursor: pointer;
  }

  .contact-submit{
    justify-self: start;
    background: var(--black);
    color: #fff;
    font-family: "Bebas Neue", sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 18px;
    border-radius: 12px;
    border: 3px solid #fff;
    cursor: pointer;
    transition: color 0.4s ease, 
    background-color 0.4s ease, 
    transform 0.4s ease;
  }

  .contact-submit:hover{
    filter: brightness(1);
	background: var(--yellow);
	color: #222;
	transform: translateY(-4px);
  }

  .contact-reset{
    justify-self: start;
    background: var(--black);
    color: #fff;
    font-family: "Bebas Neue", sans-serif;
    font-size: 16px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 12px;
    border: 2px solid #fff;
    cursor: pointer;
    transition: color 0.4s ease, 
    background-color 0.4s ease, 
    transform 0.4s ease;
  }

  .contact-reset:hover{
    filter: brightness(1);
	background: var(--yellow);
	color: #222;
	transform: translateY(-4px);
  }
	  
  .form-sent{ font-family: Montserrat, sans-serif; font-size: 18px; color: #222; background: var(--yellow); border-radius: 8px; padding: 14px 16px; margin: 20px 0 0; }
  img.gif {
    display: block;
    margin-left: auto;
    margin-right: auto;
    max-height: 200px;
    max-width: 200px;
	padding-top: 20px;
}

  </style>
</head>

  <main>
	  <img class="gif" src="Resources/me_logo_square.png" alt="Cody Miller logo">
    <div class="contact-title-band">
      <h1>Contact Me</h1>
    </div>

    <section class="contact-wrap">
      <div class="contact-line">
        Email Me:
        <a href="mailto:codyallenmiller1@gmail.com">codyallenmiller1@gmail.com</a>
      </div>

      <div class="contact-line">
        Phone:
        <span>513-828-9629</span>
      </div>

      <div class="contact-line">
        Mailing:
        <span>630 Kenilworth ter ne. Washington, d.c. 20019</span>
      </div>
    </section>
	<section class="contact-form-wrap">
	  <p class="form-sent" id="form-sent" hidden>Thanks! Your message was sent. I'll get back to you soon.</p>
	  <form class="contact-form" action="https://formsubmit.co/codyallenmiller1@gmail.com" method="POST">
		<input type="hidden" name="_subject" value="New message from codymillerinfo.com">
		<input type="hidden" name="_next" value="https://codymillerinfo.com/contact.html?sent=1">
		<input type="hidden" name="_template" value="table">
		<input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

		<div>
		  <label for="name">Name *</label>
		  <input id="name" name="name" type="text" required>
		</div>

		<div>
		  <label for="email">Email *</label>
		  <input id="email" name="email" type="email" required>
		</div>

		<div class="radio-group">
		  <label>Reason for Contact</label>
		  <div class="radio-options">
			<label class="radio-option">
			  <input type="radio" name="reason" value="Professional">
			  Professional
			</label>
			<label class="radio-option">
			  <input type="radio" name="reason" value="Speaking or interview request">
			  Request to speak or interview
			</label>
			<label class="radio-option">
			  <input type="radio" name="reason" value="Personal">
			  Personal
			</label>
			<label class="radio-option">
			  <input type="radio" name="reason" value="Other">
			  Other
			</label>
		  </div>
		</div>

		<div>
		  <label for="message">Message *</label>
		  <textarea id="message" name="message" required></textarea>
		</div>

		<button class="contact-submit" type="submit">Submit</button>

	    <input class="contact-reset" type="reset" name="reset" id="reset" value="Clear Form">

	  </form>
	</section>
</main>
